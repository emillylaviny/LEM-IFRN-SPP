{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons, usado apenas para o ícone dentro do botão "Entrar" -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'LEM/css/style.css' %}">
</head>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var campo = document.querySelector('input[name="username"]');

    function formatar(valor) {
      var digitos = valor.replace(/\D/g, '');

      // Tem letra ou @: é e-mail. Tira a pontuação que a máscara pôs na parte numérica inicial.
      if (/[^\d.\-\s]/.test(valor)) {
        return valor.replace(/^[\d.\-\s]+/, function (parte) {
          return parte.replace(/\D/g, '');
        });
      }

      // Mais de 11 dígitos: não é CPF, deixa só os números.
      if (digitos.length > 11) { return digitos; }

      if (digitos.length > 9) return digitos.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      if (digitos.length > 6) return digitos.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      if (digitos.length > 3) return digitos.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      return digitos;
    }

    campo.addEventListener('input', function () {
      var novo = formatar(campo.value);
      if (novo !== campo.value) { campo.value = novo; }
    });
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var campoSenha = document.getElementById('senha');
    var botao = document.getElementById('toggleSenha');
    var icone = document.getElementById('iconeSenha');

    if (!campoSenha || !botao || !icone) { return; }

    botao.addEventListener('click', function () {
      var estaOculta = campoSenha.type === 'password';

      campoSenha.type = estaOculta ? 'text' : 'password';
      icone.className = estaOculta ? 'bi bi-eye-slash' : 'bi bi-eye';
      botao.setAttribute('aria-label', estaOculta ? 'Ocultar senha' : 'Mostrar senha');
      botao.setAttribute('aria-pressed', estaOculta ? 'true' : 'false');
    });
  });
</script>

<body class="login-page"> 
    <div class="row g-0">
        
        <!-- Lado esquerdo: imagem/ilustração -->
        <div class="d-none d-lg-block col-lg-6 left-panel order-1 p-0">
            <img src="{% static 'LEM/assets/img/imgLogin.png' %}" alt="Login" class="w-100 h-100";>
        </div>

        <!-- Lado direito: formulário de login -->
        <div class="col-lg-6 right-panel order-2 d-flex align-items-center justify-content-center bg-white">
            <div class="form-wrapper login-form-box">
                <h1 class="login-title mb-5">Login</h1>

                {% include 'LEM/mensagens.html' %}

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="usuario" class="form-label form-label-custom">Usuário:</label>
                        <input type="text" class="form-control input-underline" id="usuario" name="username"
                        required autocomplete="username" placeholder="000.000.000-00 ou nome@email.com">
                    </div>


                    <div class="mb-3">
                        <label for="senha" class="form-label form-label-custom">Senha:</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control input-underline" id="senha" name="password"
                                    required autocomplete="current-password">
                            <button type="button" class="toggle-senha" id="toggleSenha"
                                     aria-label="Mostrar senha" aria-pressed="false">
                                <i class="bi bi-eye" id="iconeSenha"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <a href="#" class="link-custom">Esqueceu sua senha?</a>
                    </div>

                    <button type="submit" class="btn btn-access w-100 mb-4">Acessar</button>

                    <div class="d-flex align-items-center mb-4">
                        <hr class="divider-line flex-grow-1 m-0">
                        <span class="divider-text px-3">Ou continue com:</span>
                        <hr class="divider-line flex-grow-1 m-0">
                    </div>

                    <div class="d-flex justify-content-center mb-4">
                        <button type="button" class="btn btn-google d-flex align-items-center gap-2 px-4">
                            <svg width="20" height="20" viewBox="0 0 48 48">
                                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/>
                                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5c-7.6 0-14.2 4.3-17.7 10.6z"/>
                                <path fill="#4CAF50" d="M24 44.5c5.4 0 10.3-1.9 14-5.4l-6.5-5.4c-2.1 1.4-4.7 2.3-7.5 2.3-5.3 0-9.7-3.1-11.3-7.6l-6.6 5.1C9.7 40.1 16.3 44.5 24 44.5z"/>
                                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.7l6.5 5.4C41.4 36 44.5 30.6 44.5 24c0-1.2-.1-2.4-.9-3.5z"/>
                            </svg>
                            Continuar com o Google
                        </button>
                    </div>

                    <div class="text-center">
                        <a href="{% url 'cadastro' %}" class="link-custom">Ainda não possui cadastro?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
