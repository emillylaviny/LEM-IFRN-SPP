{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LEM{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons, usado apenas para o ícone dentro do botão "Entrar" -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'app/css/style.css' %}">
<!-- Montserrat -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body class=" corpo {% block body_class %}{% endblock %}">

<!-- Barra de navegação -->
<nav class="navbar navbar-expand-lg bg-white border-bottom py-2 px-4">
    <div class="container-fluid">

        <!-- Logo à esquerda -->
        <a class="navbar-brand" href="#home">
            <img src="{% static 'app/assets/img/LogoLEMnav.png' %}" alt="Logo LEM" height="50">
        </a>

        <!-- Botão hamburguer (telas pequenas) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">

            <!-- Links centralizados -->
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4 text-center fw-semibold">
                <li class="nav-item">
                    <a class="nav-link"  href="#home">HOME</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#laboratorio">LABORATÓRIO</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#materiais">MATERIAIS</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">FUNCIONAMENTO</a>
                </li>
            </ul>

            <!-- Botão Entrar à direita -->
            <a href="{% url 'login' %}"
               class="btn btn-entrar d-flex align-items-center justify-content-center gap-1">
                <i class="bi bi-box-arrow-in-right"></i> ENTRAR
            </a>
        </div>
    </div>
</nav>


        {% block content %}
        {% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
